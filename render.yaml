services:
  - type: web
    name: gerador-revendedor
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/bootstrap
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://gerador-goldxits-default-rtdb.firebaseio.com
      - key: FIREBASE_DATABASE_PATH
        value: proxyAndroid/keys
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_AUTH_TOKEN
        sync: false
      - key: BOTAPIX_API_BASE
        value: https://botapix.com/api/v1
      - key: BOTAPIX_API_KEY
        sync: false
      - key: BOTAPIX_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
