services:
  - type: web
    name: keydesk-revendedores
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/bootstrap
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
      - key: FIREBASE_DATABASE_PATH
        value: proxyAndroid/keys
